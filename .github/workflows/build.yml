name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # MUST be a single space-separated string. A YAML literal block (|)
          # preserves the newline, and the action feeds the raw value to
          # sdkmanager as ONE argument, producing
          # "Failed to find package 'platforms;android-34\nbuild-tools;34.0.0'".
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: altrex-code-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: altrex-code-unsigned-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
