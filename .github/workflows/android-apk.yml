name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies with Bun
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Create Android project if needed
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Apply safe Android launch theme
        run: |
          # Never rewrite AndroidManifest.xml here. Capacitor generates a valid
          # manifest during `cap add`; text-patching it can break XML parsing.
          mkdir -p android/app/src/main/res/values
          python3 - <<'PY2'
          from pathlib import Path
          import re

          res = Path("android/app/src/main/res/values")
          colors = res / "neo_launch_colors.xml"
          colors.write_text("<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n  <color name=\"neo_launch_background\">#FFFFFF</color>\n</resources>\n", encoding="utf-8")

          styles = res / "styles.xml"
          if not styles.exists():
              raise SystemExit("Capacitor styles.xml was not generated")

          text = styles.read_text(encoding="utf-8")
          pattern = re.compile(r'<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>', re.S)
          replacement = (
              '<style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">'
              '  <item name="android:windowBackground">@color/neo_launch_background</item>'
              '  <item name="android:statusBarColor">@color/neo_launch_background</item>'
              '  <item name="android:navigationBarColor">@color/neo_launch_background</item>'
              '  <item name="android:windowLightStatusBar">true</item>'
              '  <item name="android:windowLightNavigationBar">true</item>'
              '</style>'
          )
          replacement = "\n".join(replacement)
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Capacitor AppTheme.NoActionBarLaunch style was not found")
          styles.write_text(text, encoding="utf-8")
          PY2
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: neo-gpt-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
