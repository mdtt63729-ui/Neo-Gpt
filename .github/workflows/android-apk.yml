name: Neo Gpt Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Android versionName (example: 1.0.25)'
        required: false
        default: ''
      version_code:
        description: 'Android versionCode (example: 25)'
        required: false
        default: ''
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: neo-gpt-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build unsigned Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository checkout
        run: |
          test -f package.json
          test -f capacitor.config.ts
          echo "Repository checkout OK: $GITHUB_WORKSPACE"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build web app
        run: npm run build

      - name: Install Capacitor CLI
        run: npx cap --version

      - name: Create Android project if needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ already exists"
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set Android version from app-version.json / workflow inputs
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          cfg = json.loads(Path('app-version.json').read_text(encoding='utf-8'))
          version_name = (os.environ.get('INPUT_VERSION_NAME') or '').strip() or str(cfg.get('versionName', '')).strip()
          version_code = (os.environ.get('INPUT_VERSION_CODE') or '').strip() or str(cfg.get('versionCode', '')).strip()
          if not version_name or not re.fullmatch(r'\d+(?:\.\d+){0,3}', version_name):
              raise SystemExit(f'Invalid versionName: {version_name!r}')
          if not version_code.isdigit() or int(version_code) < 1:
              raise SystemExit(f'Invalid versionCode: {version_code!r}')
          version_code = str(int(version_code))

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text2, n_name = re.subn(r'versionName\s+[^\n]+', f'versionName "{version_name}"', text, count=1)
          text2, n_code = re.subn(r'versionCode\s+[^\n]+', f'versionCode {version_code}', text2, count=1)
          if n_name != 1 or n_code != 1:
              raise SystemExit('Could not locate versionName/versionCode in android/app/build.gradle')
          gradle.write_text(text2, encoding='utf-8')
          print(f'Android release version: {version_name} ({version_code})')
          PY

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure optional Firebase Android credentials
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('android/app/google-services.json').read_text(encoding='utf-8'))
          print('google-services.json: valid JSON')
          PY

            python3 - <<'PY'
          from pathlib import Path
          root = Path('android/build.gradle')
          app = Path('android/app/build.gradle')
          root_text = root.read_text(encoding='utf-8')
          if 'com.google.gms:google-services' not in root_text:
              root_text = root_text.replace(
                  'dependencies {',
                  "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",
                  1,
              )
              root.write_text(root_text, encoding='utf-8')
          app_text = app.read_text(encoding='utf-8')
          if 'com.google.gms.google-services' not in app_text:
              app.write_text("apply plugin: 'com.google.gms.google-services'\n" + app_text, encoding='utf-8')
          print('Google Services Gradle plugin configured')
          PY
          else
            echo 'GOOGLE_SERVICES_JSON not configured; continuing with web Firebase fallback.'
          fi

      - name: Apply immersive fullscreen and microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android.permission.RECORD_AUDIO' not in text:
              text = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
                  text,
                  count=1,
              )
              manifest.write_text(text, encoding='utf-8')
          ET.parse(manifest)
          PY

          mkdir -p android/app/src/main/java/com/neogpt/app
          cat > android/app/src/main/java/com/neogpt/app/MainActivity.java <<'JAVA'
          package com.neogpt.app;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              // Do not request microphone permission while Android is still
              // handing off the launch splash. Dictation requests permission
              // when the microphone feature is actually used.
              enterImmersiveMode();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) enterImmersiveMode();
            }

            private void enterImmersiveMode() {
              Window window = getWindow();
              window.setStatusBarColor(Color.TRANSPARENT);
              window.setNavigationBarColor(Color.TRANSPARENT);
              if (android.os.Build.VERSION.SDK_INT >= 30) {
                WindowInsetsController controller = window.getInsetsController();
                if (controller != null) {
                  controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                  controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                }
              } else {
                window.getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                );
              }
            }
          }
          JAVA

      - name: Apply safe Android launch resources
        run: |
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-night
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          res = Path('android/app/src/main/res')
          values = res / 'values'
          night = res / 'values-night'

          (values / 'neo_launch_colors.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="neo_launch_background">#FFFFFF</color></resources>\n',
              encoding='utf-8',
          )
          (night / 'neo_launch_colors.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="neo_launch_background">#121212</color></resources>\n',
              encoding='utf-8',
          )

          styles = values / 'styles.xml'
          if not styles.exists():
              raise SystemExit('Capacitor styles.xml was not generated')
          text = styles.read_text(encoding='utf-8')
          pattern = re.compile(r'<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>', re.S)
          replacement = '''<style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
            <item name="android:windowBackground">@color/neo_launch_background</item>
            <item name="android:windowSplashScreenAnimatedIcon">@drawable/neo_gpt_splash_icon</item>
            <item name="android:statusBarColor">@color/neo_launch_background</item>
            <item name="android:navigationBarColor">@color/neo_launch_background</item>
            <item name="android:windowLightStatusBar">true</item>
            <item name="android:windowLightNavigationBar">true</item>
          </style>'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Capacitor launch style not found')
          styles.write_text(text, encoding='utf-8')

          (night / 'styles.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
              <item name="android:windowBackground">@color/neo_launch_background</item>
              <item name="android:windowSplashScreenAnimatedIcon">@drawable/neo_gpt_splash_icon</item>
              <item name="android:statusBarColor">@color/neo_launch_background</item>
              <item name="android:navigationBarColor">@color/neo_launch_background</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          ''', encoding='utf-8')

          for p in [styles, night/'styles.xml', values/'neo_launch_colors.xml', night/'neo_launch_colors.xml']:
              ET.parse(p)
          print('Launch resources: valid XML')
          PY

      - name: Apply Neo Gpt premium icon and splash resources
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cat > android/app/src/main/res/drawable/neo_gpt_icon_foreground.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFFFFFFF" android:pathData="M28,74V34C28,29.9 33.2,28.1 36,31.3L72,76C74.8,79.5 80,77.2 80,72.7V34" android:strokeWidth="8" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillType="evenOdd" />
            <path android:fillColor="#FFA7F3D0" android:pathData="M80,74V34C80,29.9 74.8,28.1 72,31.3L36,76C33.2,79.5 28,77.2 28,72.7" android:strokeWidth="3.5" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillType="evenOdd" />
            <path android:fillColor="#FFA7F3D0" android:pathData="M84,18l1.8,5.2 5.2,1.8 -5.2,1.8L84,32l-1.8,-5.2L77,25l5.2,-1.8z"/>
          </vector>
          XML
          cp android/app/src/main/res/drawable/neo_gpt_icon_foreground.xml android/app/src/main/res/drawable/neo_gpt_splash_icon.xml
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/neo_icon_background" />
            <foreground android:drawable="@drawable/neo_gpt_icon_foreground" />
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > android/app/src/main/res/values/neo_icon_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="neo_icon_background">#111827</color></resources>
          XML

      - name: Verify Android project
        working-directory: android
        run: ./gradlew --version

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: neo-gpt-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
