name: Neo Gpt Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: neo-gpt-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build unsigned Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Install Capacitor CLI
        run: npx cap --version

      - name: Create Android project if needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ already exists"
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Configure optional Firebase Android credentials
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('android/app/google-services.json').read_text(encoding='utf-8'))
          print('google-services.json: valid JSON')
          PY

            python3 - <<'PY'
          from pathlib import Path
          root = Path('android/build.gradle')
          app = Path('android/app/build.gradle')
          root_text = root.read_text(encoding='utf-8')
          if 'com.google.gms:google-services' not in root_text:
              root_text = root_text.replace(
                  'dependencies {',
                  "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",
                  1,
              )
              root.write_text(root_text, encoding='utf-8')
          app_text = app.read_text(encoding='utf-8')
          if 'com.google.gms.google-services' not in app_text:
              app.write_text("apply plugin: 'com.google.gms.google-services'\n" + app_text, encoding='utf-8')
          print('Google Services Gradle plugin configured')
          PY
          else
            echo 'GOOGLE_SERVICES_JSON not configured; continuing with web Firebase fallback.'
          fi

      - name: Apply immersive fullscreen and microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android.permission.RECORD_AUDIO' not in text:
              text = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
                  text,
                  count=1,
              )
              manifest.write_text(text, encoding='utf-8')
          ET.parse(manifest)
          PY

          mkdir -p android/app/src/main/java/com/neogpt/app
          cat > android/app/src/main/java/com/neogpt/app/MainActivity.java <<'JAVA'
          package com.neogpt.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (android.os.Build.VERSION.SDK_INT >= 23 &&
                  checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 4107);
              }
              enterImmersiveMode();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) enterImmersiveMode();
            }

            private void enterImmersiveMode() {
              Window window = getWindow();
              window.setStatusBarColor(Color.TRANSPARENT);
              window.setNavigationBarColor(Color.TRANSPARENT);
              if (android.os.Build.VERSION.SDK_INT >= 30) {
                WindowInsetsController controller = window.getInsetsController();
                if (controller != null) {
                  controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                  controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                }
              } else {
                window.getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                );
              }
            }
          }
          JAVA

      - name: Apply safe Android launch resources
        run: |
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-night
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          res = Path('android/app/src/main/res')
          values = res / 'values'
          night = res / 'values-night'

          (values / 'neo_launch_colors.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="neo_launch_background">#FFFFFF</color></resources>\n',
              encoding='utf-8',
          )
          (night / 'neo_launch_colors.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="neo_launch_background">#121212</color></resources>\n',
              encoding='utf-8',
          )

          styles = values / 'styles.xml'
          if not styles.exists():
              raise SystemExit('Capacitor styles.xml was not generated')
          text = styles.read_text(encoding='utf-8')
          pattern = re.compile(r'<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>', re.S)
          replacement = '''<style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
            <item name="android:windowBackground">@color/neo_launch_background</item>
            <item name="android:statusBarColor">@color/neo_launch_background</item>
            <item name="android:navigationBarColor">@color/neo_launch_background</item>
            <item name="android:windowLightStatusBar">true</item>
            <item name="android:windowLightNavigationBar">true</item>
            <item name="android:windowSplashScreenAnimatedIcon">@drawable/neo_gpt_splash_icon</item>
          </style>'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Capacitor launch style not found')
          styles.write_text(text, encoding='utf-8')

          (night / 'styles.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
              <item name="android:windowBackground">@color/neo_launch_background</item>
              <item name="android:statusBarColor">@color/neo_launch_background</item>
              <item name="android:navigationBarColor">@color/neo_launch_background</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
              <item name="android:windowSplashScreenAnimatedIcon">@drawable/neo_gpt_splash_icon</item>
            </style>
          </resources>
          ''', encoding='utf-8')

          for p in [styles, night/'styles.xml', values/'neo_launch_colors.xml', night/'neo_launch_colors.xml']:
              ET.parse(p)
          print('Launch resources: valid XML')
          PY

      - name: Apply Neo Gpt icon resources
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/drawable/neo_gpt_icon_foreground.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFFFFF" android:pathData="M24,47C24,33.2 35.2,22 49,22h10c13.8,0 25,11.2 25,25v12c0,13.8 -11.2,25 -25,25H47l-16,11c-2.4,1.7 -5.8,-0.2 -5.5,-3.1l1,-9.8C26.1,76.1 24,68.8 24,59z"/>
            <path android:fillColor="#5B7CFA" android:pathData="M37,51c4.1,-6.1 10.2,-9.2 18,-9.2s13.9,3.1 18,9.2c-4.8,-2.7 -10.8,-4.1 -18,-4.1S41.8,48.3 37,51z"/>
            <path android:fillColor="#3949AB" android:pathData="M43,59m-2.6,0a2.6,2.6 0,1 1,5.2,0a2.6,2.6 0,1 1,-5.2,0M65,59m-2.6,0a2.6,2.6 0,1 1,5.2,0a2.6,2.6 0,1 1,-5.2,0"/>
            <path android:fillColor="#3949AB" android:pathData="M42,69 C47.2,73.2 60.8,73.2 66,69" android:strokeWidth="3.5" android:strokeLineCap="round"/>
          </vector>
          XML
          cp android/app/src/main/res/drawable/neo_gpt_icon_foreground.xml android/app/src/main/res/drawable/neo_gpt_splash_icon.xml
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/neo_icon_background" />
            <foreground android:drawable="@drawable/neo_gpt_icon_foreground" />
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > android/app/src/main/res/values/neo_icon_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="neo_icon_background">#5B7CFA</color></resources>
          XML

      - name: Verify Android project
        working-directory: android
        run: ./gradlew --version

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: neo-gpt-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
