name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies with Bun
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Create Android project if needed
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Configure optional native Firebase Android credentials
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Native Google account selection requires the Android Firebase app
          # configuration plus the app's SHA-1 fingerprints. The web Firebase
          # config is still used for the web/PWA fallback. If the secret is not
          # configured yet, the app keeps the web Google flow instead of failing
          # the APK build.
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            python3 - <<'PY2'
from pathlib import Path
import json
p = Path('android/app/google-services.json')
json.loads(p.read_text(encoding='utf-8'))
print('google-services.json: valid JSON')
PY2

            python3 - <<'PY2'
from pathlib import Path
import re

root = Path('android/build.gradle')
text = root.read_text(encoding='utf-8') if root.exists() else ''
if 'com.google.gms:google-services' not in text:
    text = text.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
    root.write_text(text, encoding='utf-8')

app = Path('android/app/build.gradle')
text = app.read_text(encoding='utf-8')
if "com.google.gms.google-services" not in text:
    text = "apply plugin: 'com.google.gms.google-services'\n" + text
    app.write_text(text, encoding='utf-8')
print('Google Services Gradle plugin configured')
PY2
          else
            echo 'GOOGLE_SERVICES_JSON secret not configured; native Google auth will use the safe web fallback.'
          fi

      - name: Apply immersive fullscreen Android chrome
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android.permission.RECORD_AUDIO' not in text:
              text = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />', text, count=1)
          manifest.write_text(text, encoding='utf-8')
          ET.parse(manifest)
          PY2

          mkdir -p android/app/src/main/java/com/neogpt/app
          cat > android/app/src/main/java/com/neogpt/app/MainActivity.java <<'EOF'
          package com.neogpt.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (android.os.Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 4107);
              }
              enterImmersiveMode();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) enterImmersiveMode();
            }

            private void enterImmersiveMode() {
              Window window = getWindow();
              window.setStatusBarColor(Color.TRANSPARENT);
              window.setNavigationBarColor(Color.TRANSPARENT);
              if (android.os.Build.VERSION.SDK_INT >= 30) {
                WindowInsetsController controller = window.getInsetsController();
                if (controller != null) {
                  controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                  controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                }
              } else {
                window.getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                );
              }
            }
          }
          EOF

          python3 - <<'PY2'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          ET.parse(manifest)
          java = Path('android/app/src/main/java/com/neogpt/app/MainActivity.java')
          if 'enterImmersiveMode' not in java.read_text(encoding='utf-8'):
              raise SystemExit('Fullscreen MainActivity patch was not written')
          print('Immersive fullscreen + microphone permission patch: valid')
          PY2

      - name: Apply safe Android launch theme
        run: |
          # Keep Capacitor's AndroidManifest.xml untouched. Only update the
          # generated launch style, and validate it before Gradle runs.
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-night
          python3 - <<'PY2'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          
          res = Path("android/app/src/main/res")
          values = res / "values"
          values_night = res / "values-night"
          
          (values / "neo_launch_colors.xml").write_text("<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n  <color name=\"neo_launch_background\">#FFFFFF</color>\n</resources>\n", encoding="utf-8")
          (values_night / "neo_launch_colors.xml").write_text("<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n  <color name=\"neo_launch_background\">#121212</color>\n</resources>\n", encoding="utf-8")
          
          styles = values / "styles.xml"
          if not styles.exists():
              raise SystemExit("Capacitor styles.xml was not generated")
          
          text = styles.read_text(encoding="utf-8")
          pattern = re.compile(r'<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>', re.S)
          replacement = (
              '<style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">\n'
              '  <item name="android:windowBackground">@color/neo_launch_background</item>\n'
              '  <item name="android:statusBarColor">@color/neo_launch_background</item>\n'
              '  <item name="android:navigationBarColor">@color/neo_launch_background</item>\n'
              '  <item name="android:windowLightStatusBar">true</item>\n'
              '  <item name="android:windowLightNavigationBar">true</item>\n'
              '</style>'
          )
          text, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit("Capacitor AppTheme.NoActionBarLaunch style was not found")
          styles.write_text(text, encoding="utf-8")
          
          night_styles = values_night / "styles.xml"
          night_styles.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '  <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">\n'
              '    <item name="android:windowBackground">@color/neo_launch_background</item>\n'
              '    <item name="android:statusBarColor">@color/neo_launch_background</item>\n'
              '    <item name="android:navigationBarColor">@color/neo_launch_background</item>\n'
              '    <item name="android:windowLightStatusBar">false</item>\n'
              '    <item name="android:windowLightNavigationBar">false</item>\n'
              '  </style>\n</resources>\n',
              encoding="utf-8"
          )
          
          for xml_file in (styles, values / "neo_launch_colors.xml", values_night / "neo_launch_colors.xml", night_styles):
              ET.parse(xml_file)
          print("Android launch resources: valid XML")
          PY2

      - name: Apply Neo Gpt Material 3 icon and splash icon
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/drawable/neo_gpt_icon_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFFFFF" android:pathData="M24,47C24,33.2 35.2,22 49,22h10c13.8,0 25,11.2 25,25v12c0,13.8 -11.2,25 -25,25H47l-16,11c-2.4,1.7 -5.8,-0.2 -5.5,-3.1l1,-9.8C26.1,76.1 24,68.8 24,59z"/>
            <path android:fillColor="#5B7CFA" android:pathData="M37,51c4.1,-6.1 10.2,-9.2 18,-9.2s13.9,3.1 18,9.2c-4.8,-2.7 -10.8,-4.1 -18,-4.1S41.8,48.3 37,51z"/>
            <path android:fillColor="#3949AB" android:pathData="M43,59m-2.6,0a2.6,2.6 0,1 1,5.2 0a2.6,2.6 0,1 1,-5.2 0M65,59m-2.6,0a2.6,2.6 0,1 1,5.2 0a2.6,2.6 0,1 1,-5.2 0"/>
            <path android:fillColor="#3949AB" android:pathData="M42,69 C47.2,73.2 60.8,73.2 66,69" android:strokeWidth="3.5" android:strokeLineCap="round"/>
            <path android:fillColor="#FFFFFF" android:pathData="M86,21l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2z" android:fillAlpha="0.92"/>
          </vector>
          EOF
          cat > android/app/src/main/res/drawable/neo_gpt_splash_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="96dp" android:height="96dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#FFFFFF" android:pathData="M24,47C24,33.2 35.2,22 49,22h10c13.8,0 25,11.2 25,25v12c0,13.8 -11.2,25 -25,25H47l-16,11c-2.4,1.7 -5.8,-0.2 -5.5,-3.1l1,-9.8C26.1,76.1 24,68.8 24,59z"/>
            <path android:fillColor="#8AB4FF" android:pathData="M37,51c4.1,-6.1 10.2,-9.2 18,-9.2s13.9,3.1 18,9.2c-4.8,-2.7 -10.8,-4.1 -18,-4.1S41.8,48.3 37,51z"/>
            <path android:fillColor="#3949AB" android:pathData="M43,59m-2.6,0a2.6,2.6 0,1 1,5.2 0a2.6,2.6 0,1 1,-5.2 0M65,59m-2.6,0a2.6,2.6 0,1 1,5.2 0a2.6,2.6 0,1 1,-5.2 0"/>
            <path android:fillColor="#3949AB" android:pathData="M42,69 C47.2,73.2 60.8,73.2 66,69" android:strokeWidth="3.5" android:strokeLineCap="round"/>
            <path android:fillColor="#FFFFFF" android:pathData="M86,21l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2z" android:fillAlpha="0.92"/>
          </vector>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/neo_icon_background" />
            <foreground android:drawable="@drawable/neo_gpt_icon_foreground" />
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/neo_icon_background" />
            <foreground android:drawable="@drawable/neo_gpt_icon_foreground" />
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/values/neo_icon_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="neo_icon_background">#5B7CFA</color></resources>
          EOF
          python3 - <<'PY2'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          values = Path('android/app/src/main/res/values')
          night = Path('android/app/src/main/res/values-night')
          for path in [values/'neo_icon_colors.xml', Path('android/app/src/main/res/drawable/neo_gpt_icon_foreground.xml'), Path('android/app/src/main/res/drawable/neo_gpt_splash_icon.xml'), Path('android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml'), Path('android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml')]:
              ET.parse(path)
          for path in [values/'styles.xml', night/'styles.xml']:
              text = path.read_text(encoding='utf-8')
              if 'android:windowSplashScreenAnimatedIcon' not in text:
                  import re
                  pattern = re.compile(r'(<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>)(.*?)(</style>)', re.S)
                  text, count = pattern.subn(lambda m: m.group(1) + m.group(2) + '  <item name="android:windowSplashScreenAnimatedIcon">@drawable/neo_gpt_splash_icon</item>\n' + m.group(3), text, count=1)
                  if count != 1:
                      raise SystemExit(f'Launch style not found in {path}')
              path.write_text(text, encoding='utf-8')
              ET.parse(path)
          print('Neo Gpt icon/splash resources: valid XML')
          PY2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: neo-gpt-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
