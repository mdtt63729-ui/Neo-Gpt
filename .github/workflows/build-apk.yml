name: Neo-Gpt Unsigned Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify unsigned release APK
        run: |
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          echo "Unsigned APK: app/build/outputs/apk/release/app-release-unsigned.apk"
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Neo-Gpt-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
