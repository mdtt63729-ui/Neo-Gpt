name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release Unsigned APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # MUST be a single space-separated string. A YAML literal block (|)
          # preserves the newline, and the action feeds the raw value to
          # sdkmanager as ONE argument, producing
          # "Failed to find package 'platforms;android-34\nbuild-tools;34.0.0'".
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload unsigned APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
