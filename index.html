<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Neo Gpt</title>
    <script>
      // Apply the persisted theme before React paints to prevent a light/dark launch flash.
      (function () {
        try {
          var saved = localStorage.getItem('neo-gpt-settings');
          var theme = saved ? JSON.parse(saved).theme : 'light';
          var dark = theme === 'dark';
          document.documentElement.style.backgroundColor = dark ? '#121212' : '#ffffff';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', dark);
        } catch (_) {
          document.documentElement.style.backgroundColor = '#ffffff';
          document.documentElement.style.colorScheme = 'light';
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <meta name="description" content="Neo Gpt - Advanced AI Assistant" />
    <meta property="og:title" content="Neo Gpt" />
    <meta property="og:description" content="Neo Gpt - Advanced AI Assistant" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="text-gray-900 antialiased selection:bg-blue-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
